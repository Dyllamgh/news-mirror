name: mirror-news

on:
  schedule:
    # 每 2 小时运行一次（UTC 时间，北京时间 +8）
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install feedparser httpx trafilatura readability-lxml

      - name: Fetch news
        run: python fetch_news.py

      - name: Commit & push
        run: |
          git config user.name "news-mirror-bot"
          git config user.email "news-mirror-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
